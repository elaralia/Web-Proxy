# /etc/nginx/sites-available/web-proxy   (then: ln -s ../sites-available/web-proxy /etc/nginx/sites-enabled/)
# Replace proxy.example.com with your domain and fix the certificate paths
# (sudo certbot --nginx -d proxy.example.com creates them for you).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name proxy.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name proxy.example.com;

    ssl_certificate     /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;

    # Raspberry Pi 4 and older (install.sh tells you if this applies): no AES instructions, so
    # HTTPS with the default AES-GCM is ~7x more CPU than ChaCha20. Uncomment to prefer ChaCha20.
    # Not needed on a Pi 5. Details: "Make HTTPS use ChaCha20" in README.md.
    # (If certbot added "include /etc/letsencrypt/options-ssl-nginx.conf", remove its
    #  ssl_prefer_server_ciphers and ssl_ciphers lines, or nginx will report duplicates.)
    # ssl_prefer_server_ciphers on;
    # ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    # nginx 1.19.4+ only (check `nginx -v`). nginx 1.18 won't start with this line: leave it
    # commented and use deploy/openssl-chacha.cnf instead (see README).
    # ssl_conf_command Ciphersuites TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Wisp is one long-lived WebSocket carrying all traffic: don't time it out or buffer it.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering off;
    }
}
