# Apache virtual host for Web-Proxy (use this if your Pi already runs Apache for PHP-Proxy).
# Enable the modules first:
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers ssl http2
# Put this in /etc/apache2/sites-available/web-proxy.conf, then:
#   sudo a2ensite web-proxy && sudo systemctl reload apache2
# Replace proxy.example.com and the certificate paths with yours
# (sudo certbot --apache -d proxy.example.com creates them).

<VirtualHost *:80>
    ServerName proxy.example.com
    Redirect permanent / https://proxy.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName proxy.example.com
    # HTTP/2 lets the browser fetch all the page's files over one connection.
    # (Ignored if Apache uses the prefork MPM, e.g. with mod_php; that's fine.)
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/proxy.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/proxy.example.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    # Long-lived WebSocket for Wisp
    ProxyTimeout 86400

    # To keep the old PHP-Proxy reachable at /old/, uncomment:
    # ProxyPass /old/ !
    # Alias /old/ /var/www/html/

    # Order matters: the WebSocket route must come before "/".
    ProxyPass        /wisp/ ws://127.0.0.1:8080/wisp/
    ProxyPass        /      http://127.0.0.1:8080/
    ProxyPassReverse /      http://127.0.0.1:8080/
</VirtualHost>
